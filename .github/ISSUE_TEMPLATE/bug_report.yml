name: Bug report
description: Report behavior that is broken or unexpected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Do not include passwords, tokens, or other sensitive information in reports or logs.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior and where you encountered it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the shortest sequence that reproduces the issue.
      placeholder: |
        1. Go to ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device (optional)
      description: Include browser/version, operating system, and device when relevant.
      placeholder: Chrome on Windows 11
    validations:
      required: false
  - type: textarea
    id: supporting_details
    attributes:
      label: Screenshots, console errors, or other details (optional)
      description: Add relevant evidence. Remove personal or sensitive information first.
    validations:
      required: false