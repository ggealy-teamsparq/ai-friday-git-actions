name: Build & Review PR

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - "my-app/**"
      - ".github/workflows/build-pr.yml"

jobs:
  build-pr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build validation
        run: npm run build

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "*Build failed* on `${{ github.repository }}` (${{ github.ref_name }})\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run> - triggered by ${{ github.actor }}"
            }

  review:
    needs: build-pr
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is a Next.js application located in the `my-app/` directory.

            Please review this pull request with a focus on:
            - Code quality and React/Next.js best practices
            - Potential bugs or logic issues
            - Security implications (XSS, SSRF, unsafe data handling, etc.)
            - Performance considerations (unnecessary re-renders, bundle size, server/client boundaries)
            - TypeScript type safety

            Severity filter - this is a demo/prototype project, not a production app:
            - Only flag something if it would cause incorrect behavior, a real security vulnerability, or a clear bug.
            - Do not flag minor accessibility edge cases (e.g. forced-colors/high-contrast mode specifics, WCAG nice-to-haves), stylistic preferences, defensive-programming suggestions, or hypothetical edge cases unlikely to matter for this app's actual usage.
            - If you're unsure whether something is a real bug versus a nitpick, skip it.

            Note: The PR branch is already checked out in the current working directory.

            IMPORTANT - avoid duplicate feedback:
            Before posting anything, check what has already been reviewed on this PR:
            - Run `gh pr view ${{ github.event.pull_request.number }} --json comments,reviews` to see prior top-level comments and reviews.
            - Run `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments` to see prior inline review comments.
            Do not repeat feedback about an issue that was already flagged in a previous comment/review and is still unresolved in the code - skip it. Only comment on issues that are genuinely new: introduced or changed since the last review, or not previously mentioned. If there is nothing new to report, do not post a comment at all.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as chat messages.

            Finally, report back truthfully whether you posted any new feedback in this run, how many comments you posted, and a one-sentence summary.

          claude_args: |
            --model claude-haiku-5-5 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)" --json-schema '{"type":"object","properties":{"posted_feedback":{"type":"boolean"},"comment_count":{"type":"number"},"summary":{"type":"string"}},"required":["posted_feedback","comment_count","summary"]}'

      # Post every review result, not only reviews that left feedback, so a
      # clean review is visible in Slack too.
      - name: Notify Slack of review result
        if: steps.review.outputs.structured_output != ''
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_PR_COMMENTS }}
          webhook-type: incoming-webhook
          payload: |
              {"text": ${{ toJSON(format('{0} *Claude reviewed PR #{1}* on `{2}` — {3} — {4} — <{5}|View PR>', fromJSON(steps.review.outputs.structured_output).posted_feedback && ':speech_balloon:' || ':white_check_mark:', github.event.pull_request.number, github.repository, fromJSON(steps.review.outputs.structured_output).posted_feedback && format('posted {0} comment(s)', fromJSON(steps.review.outputs.structured_output).comment_count) || 'no issues found', fromJSON(steps.review.outputs.structured_output).summary, github.event.pull_request.html_url)) }}}
